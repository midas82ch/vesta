[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vesta-api"
version = "0.1.0"
description = "API und deterministischer Vermittlungskern für Vesta"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "ruff>=0.12,<1",
]
ai = [
  "anthropic>=0.70,<1",
  "openai>=1.40,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vesta_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
