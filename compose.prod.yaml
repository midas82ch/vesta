x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VESTA_SITE_ADDRESS: ${VESTA_SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      VESTA_API_URL: http://api:8000
    expose:
      - "3000"
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      VESTA_ENV: production
    secrets:
      - database-url
    expose:
      - "8000"
    networks:
      - backend
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "alembic",
        "-c",
        "/app/apps/api/alembic.ini",
        "upgrade",
        "head",
      ]
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
    secrets:
      - database-url
    networks:
      - egress
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  frontend:
  backend:
    internal: true
  egress:

volumes:
  caddy-data:
  caddy-config:

secrets:
  database-url:
    file: ${DATABASE_URL_FILE:-./secrets/database-url}
