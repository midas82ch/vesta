services:
  db:
    build:
      context: ./infra/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vesta}
      POSTGRES_USER: ${POSTGRES_USER:-vesta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vesta-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - vesta-db:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        "alembic",
        "-c",
        "/app/apps/api/alembic.ini",
        "upgrade",
        "head",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vesta:vesta-local@db:5432/vesta}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "vesta_api.cli.seed_demo"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vesta:vesta-local@db:5432/vesta}
      OFFER_DATA_PATH: /app/data/seed/offers.example.json
    depends_on:
      migrate:
        condition: service_completed_successfully

  ingest:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "vesta_api.cli.ingest_offers"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vesta:vesta-local@db:5432/vesta}
      OFFER_SOURCE_CATALOG_PATH: /app/data/sources/bern_offers.json
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - jobs

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vesta:vesta-local@db:5432/vesta}
      VESTA_ENV: ${VESTA_ENV:-development}
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VESTA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  vesta-db:
